<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tercer Grado - Experiencia Bereshit</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/game.css">
    <link rel="stylesheet" href="../css/calculator.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <!-- Back button overlayed -->
        <button class="back-btn-overlay" onclick="goBack()" title="Volver al menú">✕</button>
        <button class="restart-btn-overlay" onclick="location.reload()" title="Reiniciar juego">
            <span class="restart-icon">↻</span>
        </button>
        <button class="fullscreen-btn-overlay" onclick="toggleFullscreen()" title="Pantalla Completa">
            <span class="fullscreen-icon">⛶</span>
        </button>
    </div>
    
    <script src="../js/utils.js"></script>
    <script src="../js/games/calculator-challenge.js"></script>
    <script>
        // Initialize the Calculator Challenge game
        const gameContainer = document.getElementById('gameContainer');
        const game = new CalculatorChallenge(gameContainer, {
            maxTarget: 2500
        });

        // Try auto-fullscreen
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof setupAutoFullscreen === 'function') {
                setupAutoFullscreen();
            }
        });

        function goBack() {
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>
