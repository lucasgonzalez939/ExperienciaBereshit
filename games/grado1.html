<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primer Grado - Experiencia Bereshit</title>
    <link rel="stylesheet" href="../css/game.css">
</head>
<body>
    <div class="game-container">
        <div class="game-content" id="gameArea">
            <!-- Game will be loaded here -->
        </div>
        
        <!-- Back button overlayed -->
        <button class="back-btn-overlay" onclick="goBack()" title="Volver al menú">✕</button>
        <button class="restart-btn-overlay" onclick="location.reload()" title="Reiniciar juego">
            <span class="restart-icon">↻</span>
        </button>
        <button class="fullscreen-btn-overlay" onclick="toggleFullscreen()" title="Pantalla Completa">
            <span class="fullscreen-icon">⛶</span>
        </button>
    </div>
    
    <script src="../js/utils.js"></script>
    <script src="../js/games/galaxy-math-defender.js"></script>
    <script>
        // Initialize game with easy difficulty for grade 1
        document.addEventListener('DOMContentLoaded', () => {
            const gameArea = document.getElementById('gameArea');
            const game = new GalaxyMathDefender(gameArea, {
                difficulty: 'easy',
                maxNumber: 10,
                operations: ['+'],
                grade: 1
            });
            
            // Try auto-fullscreen using robust utility
            if (typeof setupAutoFullscreen === 'function') {
                setupAutoFullscreen();
            }
        });
        
        // Use robust toggle from utils.js
        // The button calls toggleFullscreen() which is now defined in utils.js
        // But since we have an inline function with the same name, we should remove it
        // or make it call the utility.
        // However, utils.js is loaded BEFORE this script block.
        // If utils.js defines toggleFullscreen in global scope, we don't need to redefine it here.
        // But wait, the onclick="toggleFullscreen()" in HTML will look for window.toggleFullscreen.
        // If utils.js defines it, we are good.
        // So I should REMOVE the inline function definition.
        
        function goBack() {
            if (confirm('¿Seguro que quieres salir del juego?')) {
                window.location.href = '../index.html';
            }
        }
    </script>
</body>
</html>
